<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Horizon & Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      const t = localStorage.getItem('horizon_now_theme');
      if (t && t !== 'paper') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="themes.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <button id="authBtn" class="sync-pill offline">Sign in</button>

      <nav class="zoom-switcher" aria-label="Time horizon">
        <button class="zoom-btn" data-view="year">Year</button>
        <button class="zoom-btn" data-view="month">Month</button>
        <button class="zoom-btn active" data-view="day" id="navDayBtn">Today</button>
      </nav>

      <div class="topbar-actions">
        <button class="btn-dump" id="openDumpBtn">
          <span>Dump</span>
          <span class="badge" id="dumpCount">0</span>
        </button>
        <button class="btn-icon" id="openSettingsBtn" aria-label="Settings">⚙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="view-day" class="view-section active">
      <div class="micro-header">
        <div class="date-row">
          <h1 class="micro-title" id="selectedDateFull"></h1>
          <button class="btn-secondary" id="backToTodayBtn" style="display:none;">← Today</button>
        </div>
        <div class="season-pills" id="activeSeasonsPills"></div>
      </div>

      <div class="micro-grid">
        <div class="card">
          <div class="section-head">
            <h2>Daily 3</h2>
            <span class="slot-counter"><span id="daily3Count">0</span>/3</span>
          </div>
          <div class="task-list" id="daily3List"></div>
        </div>

        <div class="card">
          <div class="section-head">
            <h2>Events</h2>
            <button class="btn-secondary" id="addEventBtn" style="padding:5px 11px;font-size:0.78rem;">+ Add</button>
          </div>
          <div id="dayEventsContainer"></div>
        </div>
      </div>
    </section>

    <section id="view-month" class="view-section">
      <div class="month-header">
        <div class="month-nav">
          <button class="btn-icon" id="prevMonthBtn" aria-label="Previous month">←</button>
          <h1 class="month-title" id="monthViewTitle"></h1>
          <button class="btn-icon" id="nextMonthBtn" aria-label="Next month">→</button>
        </div>
        <button class="btn-secondary" id="monthAddEventBtn">+ Event</button>
      </div>
      <div class="weekdays-row">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div class="month-grid" id="monthGrid"></div>
    </section>

    <section id="view-year" class="view-section">
      <div class="month-header">
        <h1 class="month-title" id="yearViewTitle"></h1>
        <button class="btn-secondary" id="addSeasonBtn">+ Season</button>
      </div>
      <div class="card seasons-card" id="seasonsCard">
        <div id="seasonsList"></div>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </section>
  </main>

  <div class="overlay" id="dumpOverlay">
    <div class="drawer">
      <div class="section-head">
        <h2>Brain Dump</h2>
        <button class="btn-icon" id="closeDumpBtn" aria-label="Close">✕</button>
      </div>
      <form id="dumpForm" style="margin-bottom:16px;">
        <input type="text" id="dumpInput" class="input-field" placeholder="Capture thought..." required />
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">Add</button>
      </form>
      <div id="dumpList" style="flex:1;"></div>
    </div>
  </div>

  <div class="modal-center" id="eventModal">
    <div class="modal-box">
      <div class="section-head">
        <h2>New Event</h2>
        <button class="btn-icon" id="closeEventModal">✕</button>
      </div>
      <form id="eventForm">
        <input type="text" id="eventTitleInput" class="input-field" placeholder="Title" required />
        <input type="date" id="eventDateInput" class="input-field" required />
        <select id="eventTypeInput" class="input-field">
          <option value="milestone">Milestone</option>
          <option value="appointment">Appointment</option>
        </select>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">Save</button>
      </form>
    </div>
  </div>

  <div class="modal-center" id="seasonModal">
    <div class="modal-box">
      <div class="section-head">
        <h2>New Season</h2>
        <button class="btn-icon" id="closeSeasonModal">✕</button>
      </div>
      <form id="seasonForm">
        <input type="text" id="seasonTitleInput" class="input-field" placeholder="Season name" required />
        <input type="number" id="seasonStartInput" class="input-field" min="1" max="12" placeholder="Start month (1–12)" required />
        <input type="number" id="seasonEndInput" class="input-field" min="1" max="12" placeholder="End month (1–12)" required />
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">Save</button>
      </form>
    </div>
  </div>

  <div class="modal-center" id="settingsModal">
    <div class="modal-box">
      <div class="section-head">
        <h2>Settings</h2>
        <button class="btn-icon" id="closeSettingsModal">✕</button>
      </div>

      <select id="themeSelect" class="input-field" style="margin-bottom:16px;">
        <option value="paper">Warm Paper</option>
        <option value="midnight">Midnight Dark</option>
        <option value="nordic">Nordic Mist</option>
      </select>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn-primary" id="exportJsonBtn" style="justify-content:center;">Export JSON</button>
        <label class="btn-secondary" style="justify-content:center;cursor:pointer;">
          Import JSON
          <input type="file" id="importJsonInput" accept=".json" style="display:none;" />
        </label>
        <button class="btn-secondary" id="clearSampleBtn" style="justify-content:center;color:var(--terracotta);">Clear Data</button>
        <button class="btn-secondary" id="signOutBtn" style="justify-content:center;display:none;">Sign Out</button>
      </div>
    </div>
  </div>

  <div class="focus-sanctuary" id="focusSanctuary">
    <h2 id="focusTaskTitle" style="font-size:1.6rem;max-width:480px;"></h2>
    <div class="breath-circle"><div class="timer-display" id="timerDisplay">25:00</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="btn-primary" id="toggleTimerBtn">Pause</button>
      <button class="btn-secondary" id="focusDumpBtn">+ Dump</button>
      <button class="btn-secondary" id="exitFocusBtn">Exit</button>
    </div>
  </div>

  <script>

      }
    };
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
